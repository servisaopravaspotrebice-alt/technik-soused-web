name: Technik Soused - Preview GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'techniksoused-pages-preview.zip'
      - '.github/workflows/technik-soused-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: technik-soused-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Extract preview website
        run: |
          mkdir -p _site
          unzip -q techniksoused-pages-preview.zip -d _site
          test -f _site/index.html
          test -f _site/.nojekyll
          test ! -f _site/ADMIN_GLAVNY.html
          test ! -f _site/ADMIN_DISPECER.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
